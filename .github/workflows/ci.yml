name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t devops-api .

      - name: Subir container
        run: docker run -d -p 5000:5000 --name api devops-api

      - name: Aguardar API subir
        run: sleep 5

      - name: Testar health check
        run: curl --fail http://localhost:5000/health

      - name: Parar container
        run: docker stop api
